name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire official YB tab icon
        run: python3 -c "from pathlib import Path; p=Path('index.html'); t=p.read_text() if p.exists() else ''; s='<link rel=\"icon\" type=\"image/svg+xml\" href=\"https://yuriybortnik.com/favicon.svg\">\n<link rel=\"icon\" type=\"image/png\" sizes=\"32x32\" href=\"https://yuriybortnik.com/favicon-32.png\">\n<link rel=\"apple-touch-icon\" href=\"https://yuriybortnik.com/apple-touch-icon.png\">\n';
          p.write_text(t if (not t or 'yuriybortnik.com/favicon' in t) else t.replace('<head>','<head>\n'+s,1)) if t else None"
      - name: Wire official YB crest
        run: python3 -c "from pathlib import Path; p=Path('index.html');
          t=p.read_text() if p.exists() else '';
          s='<script src=\"yb-crest.js\"></script>';
          p.write_text(t if (not t or 'yb-crest.js' in t) else t.replace('</body>', s+'</body>', 1)) if t else None"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
